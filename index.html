<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RDPC</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f0f0f">

  <link rel="icon" type="image/png" href="RDPC-app-icon-favicon.png">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="RDPC">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="RDPC-app-icon-ati.png">

  <meta name="msapplication-TileColor" content="#0f0f0f">
  <meta name="msapplication-TileImage" content="RDPC-app-icon-512.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { 
      --bg:#f6f8fb; 
      --card:#ffffff; 
      --text:#0f172a; 
      --muted:#5b6b7c; 
      --accent:#0ea5e9; 
      --ok:#10b981; 
      --warn:#f59e0b; 
      --bad:#ef4444;
      --red1:#ef5350; 
      --red2:#c62828; 
      --red1h:#ff6f6b; 
      --red2h:#d32f2f; 
      --shadow:0 12px 30px rgba(15, 23, 42, .12); 
      --stroke:rgba(2,6,23,.08); 
      --pillbg:rgba(2,6,23,.04); 
      --pillstroke:rgba(2,6,23,.08); 
      --bg-grad1:#f0f4f8; 
      --bg-grad2:#e6edf5; 
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0; font:16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji"; background:radial-gradient(1200px 600px at 80% -10%, var(--bg-grad1) 0, var(--bg-grad2) 50%), var(--bg); color:var(--text); display:grid; place-items:center; -webkit-user-select: none; user-select: none;}
    .wrap{width:min(500px, 94vw); margin: 20px 0;} 
    .card{background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.01)); border:1px solid var(--stroke); border-radius:20px; padding:22px; box-shadow:var(--shadow)}
    h1{color: #2C3E50; font-family: "Georgia", serif; letter-spacing: 3px; font-weight:600; font-size:clamp(25px, 3vw, 30px); margin:0 0 4px}
    .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px}
    p.sub{color:var(--muted); margin:0 0 16px; font-size:14px;}
    .field{background:var(--card); border:1px solid var(--stroke); border-radius:14px; padding:12px; position:relative; margin-bottom:12px}
    .field.readonly{background:rgba(0,0,0,0.05); border-style: dashed;}
    .field.highlight{border-color: var(--accent);}
    label{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); letter-spacing:.3px; margin-bottom:4px}
    .label-badge{font-weight:700; color:var(--accent)}
    .input-container { display:flex; align-items:center; justify-content:space-between; }
    input{width:100%; background:transparent; border:none; outline:none; color:var(--text); font-size:20px; font-weight:600 -webkit-user-select: auto; user-select: auto;}
    input:disabled{color:var(--text); opacity:1; -webkit-text-fill-color: var(--text);}
    .unit{font-size:18px; color:var(--muted); font-weight:500; margin-left:8px}
    .rate{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:10px; color:var(--muted)}
    .pill{border:1px solid var(--pillstroke); background:var(--pillbg); padding:6px 10px; border-radius:999px; font-size:12px; font-weight:600; cursor:pointer;}
    .meta {display:flex; justify-content:space-between; align-items:center; margin-top:14px; color:var(--muted); font-size:13px}
    .rate .right {margin-left:auto;}
    .hide-slide {max-height: 0 !important; opacity: 0 !important; margin-top: 0 !important; margin-bottom: 0 !important; padding-top: 0 !important; padding-bottom: 0 !important; overflow: hidden !important; border: none !important; transition: all 0.4s ease-in-out;}
    .field, .grid {transition: all 0.4s ease-in-out; max-height: 150px;} /* Adjust if your fields are taller than 150px */
    .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
    @keyframes blink-red {
      0%, 100% { 
        border-color: var(--bad); 
        box-shadow: 0 0 8px rgba(239, 68, 68, 0.5); 
      }
      50% { 
        border-color: var(--stroke); 
        box-shadow: none; 
      }
    }
    .field.error-highlight {
      animation: blink-red 1s infinite;
      border-color: var(--bad);
    }
    #statusDot{width:10px;height:10px;border-radius:50%;background:var(--warn); display:inline-block; vertical-align:middle; margin-right:6px;animation: blink-full 0.5s cubic-bezier(0.4, 0, 0.6, 1) infinite alternate;}
    @keyframes blink-full {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
    .orientation-warning {display: none;position: fixed;top: 0; left: 0; width: 100vw; height: 100vh;background: #0f172a;color: #ffffff;z-index: 9999;justify-content: center;align-items: center;text-align: center;padding: 20px;}
    @media (orientation: landscape) and (max-width: 767px) {.orientation-warning {display: flex;}.wrap {display: none;}}
  </style>
</head>
<body>
  <div class="orientation-warning">
    <div class="warning-text">
      <p style="font-size: 24px; font-weight: bold;">Please Rotate Your Device</p>
    </div>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="topbar">
        <div>
          <h1 id="appTitle" style="cursor: pointer; user-select: none;">RDPC</h1>
        </div>
	<span class="pill" id="src">$1 = ₹ ...</span>
      </div>
  
      <div class="grid">
        <div class="field">
          <label>Diamond Type</label>
          <div class="input-container">
            <input id="diamondType" type="text" list="type-options" autocomplete="off">
            <datalist id="type-options">
              <option value="Natural"></option><option value="Lab Grown"></option>
            </datalist>
          </div>
        </div>
        <div class="field">
          <label>Certification</label>
          <div class="input-container">
            <input id="certification" type="text" list="cert-options" autocomplete="off">
            <datalist id="cert-options">
              <option value="GIA"></option><option value="IGI"></option><option value="HRD"></option><option value="Non"></option>
            </datalist>
          </div>
        </div>
      </div>

      <div class="grid">
        <div class="field">
          <label>Color Grade</label>
          <div class="input-container">
            <input id="colour" type="text" list="colour-options" autocomplete="off" style="text-transform: uppercase;">
            <datalist id="colour-options">
	      <option value="D"></option><option value="E"></option><option value="F"></option><option value="G"></option>
              <option value="H"></option><option value="I"></option><option value="J"></option><option value="K"></option>
              <option value="L"></option><option value="M"></option><option value="N"></option><option value="O"></option>
	      <option value="P"></option><option value="Q"></option><option value="R"></option><option value="S"></option>
	      <option value="T"></option><option value="U"></option><option value="V"></option><option value="W"></option>
	      <option value="X"></option><option value="Y"></option><option value="Z"></option><option value="D-F"></option>
	      <option value="G-H"></option><option value="I-J"></option><option value="K-L"></option><option value="M-N"></option>
	      <option value="O-P"></option><option value="Q-R"></option><option value="S-T"></option><option value="U-V"></option>
	      <option value="W-X"></option><option value="Y-Z"></option>              
            </datalist>
          </div>
        </div>
        <div class="field">
          <label>Clarity Grade</label>
          <div class="input-container">
            <input id="clarity" type="text" list="clarity-options" autocomplete="off" style="text-transform: uppercase;">
            <datalist id="clarity-options">
              <option value="IF"></option><option value="IF-VVS"></option><option value="VVS"></option><option value="VVS1"></option>
	      <option value="VVS2"></option><option value="VS"></option><option value="VS1"></option><option value="VS2"></option>
	      <option value="SI"></option><option value="SI1"></option><option value="SI2"></option><option value="SI3"></option>
	      <option value="I"></option><option value="I1"></option><option value="I2"></option><option value="I3"></option>
            </datalist>
          </div>
        </div>
      </div>

      <div class="grid">
        <div class="field">
          <label>Matrix Number</label>
          <div class="input-container">
            <input id="matrix" type="number" inputmode="numeric" min="0" step="any">
          </div>
        </div>
        <div class="field">
          <label>Weight</label>
          <div class="input-container">
            <input id="weight" type="number" inputmode="decimal" min="0" step="any" placeholder="0.00">
            <span class="unit">ct</span>
          </div>
        </div>
      </div>

      <div class="grid" id="discountDiacostGrid">
        <div class="field">
          <label>Discount</label>
          <div class="input-container">
            <input id="discount" type="number" inputmode="decimal" min="0" max="100" step="any" placeholder="0">
            <span class="unit">%</span>
          </div>
        </div>
        <div class="field readonly">
          <label>Diamond Cost / ct</label>
          <div class="input-container">
            <span>₹</span><input id="costPerCt" type="text" readonly placeholder="0">          
          </div>
        </div>
      </div>

      <div class="grid">
        <div class="field">
          <label id="yourDiscountLabel">Your Discount</label>
          <div class="input-container">
            <input id="yourDiscount" type="number" inputmode="decimal" min="0" max="100" step="any" placeholder="0">
            <span class="unit">%</span>
          </div>
        </div>

        <div class="field readonly">
          <label>Diamond Price / ct</label>
          <div class="input-container">
            <span>₹</span><input id="pricePerCt" type="text" readonly placeholder="0">
          </div>
        </div>
      </div>

      <div class="grid" id="marginProfitGrid">
        <div class="field readonly">
          <label>Margin / ct</label>
          <div class="input-container">
            <span>₹</span><input id="marginPerCt" type="text" readonly placeholder="0">          
          </div>
        </div>

        <div class="field readonly highlight">
          <label>Profit</label>
          <div class="input-container">
            <span>₹</span><input id="profit" type="text" readonly placeholder="0">          
          </div>
        </div>
      </div>

      <div class="field readonly">
        <label>Total Diamond Price</label>
        <div class="input-container">
          <span>₹</span><input id="totalPrice" type="text" readonly placeholder="0">          
        </div>
      </div>

      <div class="meta">
        <div><span id="statusDot"></span><span id="status"></span></div>
	<div style="display: flex; gap: 8px;">
          <button id="summaryBtn" class="pill" style="display:flex; align-items:center; justify-content:center; padding: 6px; border-radius: 50%; width: 32px; height: 32px;" aria-label="Summary">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <text x="12" y="20" font-family="Arial" font-size="8" font-weight="bold" fill="currentColor" stroke="none" text-anchor="middle">₹</text>
	        <line x1="8" y1="7" x2="11" y2="7"></line>
	        <line x1="8" y1="11.5" x2="16" y2="11.5"></line>
                </svg>
          </button>

	  <button id="shareBtn" class="pill" style="display:flex; align-items:center; justify-content:center; padding: 6px; border-radius: 50%; width: 32px; height: 32px;" aria-label="Share">
            <i class="fa-solid fa-share-from-square" style="font-size: 15px;"></i>
          </button>
	</div>
      </div>
    </div>
  </div>

<script>
if (window.matchMedia("(max-width: 767px)").matches) {
  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock('portrait').catch((err) => {
      console.warn("Orientation lock not fully enforced by browser context:", err);
    });
  }
}

(() => {
  const colourEl = document.getElementById('colour');
  const clarityEl = document.getElementById('clarity');
  const matrixEl = document.getElementById('matrix');
  const discountEl = document.getElementById('discount');
  const costPerCtEl = document.getElementById('costPerCt');
  const yourDiscountEl = document.getElementById('yourDiscount');
  const pricePerCtEl = document.getElementById('pricePerCt');
  const marginPerCtEl = document.getElementById('marginPerCt');
  const weightEl = document.getElementById('weight');
  const profitEl = document.getElementById('profit');
  const totalPriceEl = document.getElementById('totalPrice');
  const statusEl = document.getElementById('status');
  const dotEl = document.getElementById('statusDot');
  const srcPill = document.getElementById('src');
  const appTitleEl = document.getElementById('appTitle');
  const shareBtn = document.getElementById('shareBtn');

  // Internal State
  let currentExRate = 0; // Holds the live rate for calculations

  // Numbers formatter
  function fmt(n) {
    if (isNaN(n) || !isFinite(n)) return '0';
    return Number(n).toLocaleString('en-IN', {minimumFractionDigits: 0, maximumFractionDigits: 0});
  }

  function calculate() {
    const matrix = parseFloat(matrixEl.value) || 0;
    const discount = parseFloat(discountEl.value) || 0;
    const yourDiscount = parseFloat(yourDiscountEl.value) || 0;
    const weight = parseFloat(weightEl.value) || 0;
    const basePriceUsd = matrix * 100;
    
    // Fallback to 0 if rate hasn't loaded yet
    const exRate = currentExRate || 0; 

    // Cost calculations
    const costPerCtUsd = basePriceUsd * (1 - (discount / 100));
    const costPerCtInr = costPerCtUsd * exRate;

    // Price calculations
    const pricePerCtUsd = basePriceUsd * (1 - (yourDiscount / 100));
    const pricePerCtInr = pricePerCtUsd * exRate;

    // Output generation
    const marginPerCtInr = pricePerCtInr - costPerCtInr;
    const totalProfit = marginPerCtInr * weight;
    const totalDiamondPrice = pricePerCtInr * weight;

    // Sync views
    costPerCtEl.value = fmt(costPerCtInr);
    pricePerCtEl.value = fmt(pricePerCtInr);
    marginPerCtEl.value = fmt(marginPerCtInr);
    profitEl.value = fmt(totalProfit);
    totalPriceEl.value = fmt(totalDiamondPrice);
  }

  function setStatus(text, ok=false){
    statusEl.textContent = text;
    dotEl.style.background = ok ? 'var(--ok)' : 'var(--warn)';
  }

  async function fetchSmart(url) {
    const uniqueUrl = url + (url.includes('?') ? '&' : '?') + '_t=' + Date.now();
    let text = '';

    try {
      const response = await fetch(uniqueUrl);
      if (!response.ok) throw new Error('Direct fetch failed');
      text = await response.text();
    } catch (directError) {
      console.warn("Direct fetch failed, trying proxy...", directError);
      try {
        const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(uniqueUrl);
        const proxyResponse = await fetch(proxyUrl);
        if (!proxyResponse.ok) throw new Error('Corsproxy failed');
        text = await proxyResponse.text();
      } catch (proxyError) {
        console.warn("Corsproxy failed, trying allorigins...", proxyError);
        const backupProxy = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(uniqueUrl);
        const backupResponse = await fetch(backupProxy);
        if (!backupResponse.ok) throw new Error('All proxies failed');
        text = await backupResponse.text();
      }
    }
    return text;
  }

  async function fetchLiveRate() {
    setStatus('Updating ExRate…');
    try {
      const text = await fetchSmart('https://api.frankfurter.dev/v1/latest?from=USD&to=INR');
      const data = JSON.parse(text); 
      const rate = data && data.rates && data.rates['INR'];
      
      if(typeof rate === 'number' && isFinite(rate) && rate > 0) {
        currentExRate = rate;
        srcPill.textContent = `$1 = ₹ ${rate.toFixed(2)}`;
        setStatus('LIVE', true);
        calculate();
      } else {
        setStatus('Error interpreting ExRates');
      }
    } catch(err) {
      console.error(err);
      setStatus('Error fetching ExRate');
    }
  }

  // Listeners
  [matrixEl, discountEl, yourDiscountEl, weightEl].forEach(el => {
    el.addEventListener('input', calculate);
  });
  [weightEl].forEach(el => {
    el.addEventListener('blur', function() {
      if (this.value) {
        this.value = parseFloat(this.value).toFixed(2);
        calculate(); 
      }
    });
  });
  [colourEl, clarityEl].forEach(el => {
    if (el) {
      el.addEventListener('input', function() {
        const start = this.selectionStart;
        const end = this.selectionEnd;
        this.value = this.value.toUpperCase();
        this.setSelectionRange(start, end);
      });
    }
  });

  srcPill.addEventListener('click', () => {
    fetchLiveRate();
  });

  const summaryBtn = document.getElementById('summaryBtn');
  const rdpcTitle = document.getElementById('appTitle');
  const yourDiscountLabel = document.getElementById('yourDiscountLabel');

  const toggleElements = [
    document.getElementById('discountDiacostGrid'),
    document.getElementById('marginProfitGrid'),
    summaryBtn
  ];

  if (summaryBtn) {
    summaryBtn.addEventListener('click', () => {
      toggleElements.forEach(el => {
        if (el) el.classList.add('hide-slide');
      });
    
      if (yourDiscountLabel) {
        yourDiscountLabel.textContent = 'Discount';
      }
    });
  }

  let pressTimer;
  const startPress = (e) => {
    pressTimer = setTimeout(() => {
      toggleElements.forEach(el => {
        if (el) el.classList.remove('hide-slide');
      });
    
      if (yourDiscountLabel) {
        yourDiscountLabel.textContent = 'Your Discount';
      }
    }, 3000); 
  };

  const cancelPress = () => {
    clearTimeout(pressTimer); // Cancel if let go before 3 seconds
  };

  if (rdpcTitle) {
    rdpcTitle.addEventListener('mousedown', startPress);
    rdpcTitle.addEventListener('touchstart', startPress);
    rdpcTitle.addEventListener('mouseup', cancelPress);
    rdpcTitle.addEventListener('mouseleave', cancelPress);
    rdpcTitle.addEventListener('touchend', cancelPress);
    rdpcTitle.addEventListener('touchcancel', cancelPress);
  }

  if (shareBtn) {
    const requiredInputs = ['diamondType', 'certification', 'colour', 'clarity', 'matrix', 'weight', 'discount', 'yourDiscount'];
    requiredInputs.forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener('input', function() {
          const field = this.closest('.field');
          if (field && this.value.trim() !== '') {
            field.classList.remove('error-highlight');
          }
        });
      }
    });
    shareBtn.addEventListener('click', async () => {
      let isFormValid = true;
      requiredInputs.forEach(id => {
        const inputEl = document.getElementById(id);
        if (inputEl) {
          const fieldEl = inputEl.closest('.field');
          if (inputEl.value.trim() === '') {
            if (fieldEl) fieldEl.classList.add('error-highlight');
            isFormValid = false;
          } else {
            if (fieldEl) fieldEl.classList.remove('error-highlight');
          }
        }
      });

      if (!isFormValid) {
        if (navigator.vibrate) navigator.vibrate(200); 
        return; 
      }

      const typeVal = document.getElementById('diamondType').value || '';
      const certVal = document.getElementById('certification').value || '';
      const colourVal = document.getElementById('colour').value || '';
      const clarityVal = document.getElementById('clarity').value || '';
      const weight = parseFloat(weightEl.value) || 0;
      const yourDiscount = parseFloat(yourDiscountEl.value) || 0;
      const totalPriceEl = document.getElementById('totalPrice');
      const totalPriceVal = totalPriceEl ? totalPriceEl.value : '0';
      const encodingMap = {1: 'B', 2: 'R', 3: 'I', 4: 'J', 5: 'M', 6: 'O', 7: 'H', 8: 'A', 9: 'N', 0: 'X'};
      let codedDiscount = yourDiscount.toString();
      for (const [key, value] of Object.entries(encodingMap)) {
        codedDiscount = codedDiscount.replace(new RegExp(key, 'g'), value);
      }

      //Share text
      const shareText = `E${codedDiscount}\n\n` +
	`${typeVal} Diamond - ${certVal} certified\n\n` +
        `Color Grade: *${colourVal}*\n` +
	`Clarity Grade: *${clarityVal}*\n` +
        `Carat Weight: *${weight.toFixed(2)} ct*\n` +
        `Price/ct: ₹ ${pricePerCtEl.value}\n\n` +
        `Total Price: ₹ ${totalPriceVal}`;

      if (navigator.share) {
        try {
          await navigator.share({
            title: 'RDPC sharing',
            text: shareText
          });
        } catch (err) {
          console.log('Share canceled or failed:', err);
        }
      } else {
        navigator.clipboard.writeText(shareText).then(() => {
          alert('Details copied to clipboard!');
        }).catch(err => {
          console.error('Failed to copy text: ', err);
        });
      }
    });
  }

  // Initialize
  fetchLiveRate();
  setInterval(fetchLiveRate, 60 * 1000); // sync every 60 seconds
})();
</script>
</body>
</html>
